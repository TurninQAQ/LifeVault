[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifevault"
version = "0.5.0"
description = "Local-first life credential and reminder assistant"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "requests>=2.31,<3",
  "streamlit>=1.36,<2",
  "plyer>=2.1,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=1.28,<2",
]

[tool.setuptools.packages.find]
include = ["lifevault*"]
