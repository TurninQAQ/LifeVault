[metadata]
name = lifevault
version = attr: lifevault.__version__
description = Local-first life credential and reminder assistant
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/TurninQAQ/LifeVault

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
zip_safe = False
install_requires =
    pydantic>=2.7,<3
    requests>=2.31,<3
    streamlit>=1.36,<2
    plyer>=2.1,<3
    langgraph>=1.0,<2
    langgraph-checkpoint-sqlite>=3.1,<4
    mcp>=1.28,<2
    cryptography>=46.0.3,<50
    packaging>=24,<27

[options.packages.find]
include = lifevault*

[options.package_data]
lifevault =
    eval/data/*.jsonl
    skills/*/SKILL.md

[options.entry_points]
console_scripts =
    lifevault = lifevault.cli:main
    lifevault-mcp = lifevault.mcp_server.server:main
